		<p class="cs95E872D0"><span class="cs1B16EEB5">can a person be happy and depressed at the same time?</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">apparently that is possible.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">i need to clean my room,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">still have much to do,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">i just keep avoiding it.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">offline stuff.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">i gotta change my mindset.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
