		<p class="cs95E872D0"><span class="cs1B16EEB5">Ultimately, I give credit to Sketchup&#39;s stretching feature </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">from the surface of the object. It allowed me to imagine</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">scaling. Alongside cutting the object by a line, diagonally.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Then retracting into it, then the object is cut in two,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and remaining disappears. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
