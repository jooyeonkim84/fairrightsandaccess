		<p class="cs95E872D0"><span class="cs1B16EEB5">David, I noticed you left the water on in the bathroom</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">with the knob turned to the left. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">I don&#39;t get the message but if you mean if you </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">were not as hostile as I thought on the banging,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">or the messages on there.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">ok. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">But it&#39;d be best not to keep it running. &nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
