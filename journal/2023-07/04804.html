		<p class="cs95E872D0"><span class="cs1B16EEB5">Bought a private writing device, needs to wait on the shipment.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">This should work.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Last writing device, still waiting on the correct adapter. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">And because I speak about writing, it doesn&#39;t mean I don&#39;t need help.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">I would like to get out of all this. </span></p></body>
