		<p class="cs95E872D0"><span class="cs1B16EEB5">bring back what they&#39;ve said before.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">if they contradict what was spoken.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">they have already admitted many things.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">i&#39;m not looking back in anger. i was furious then during</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">those times. i merely hid that anger thinking of revenge.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">they have to be charged for this.</span></p></body>
