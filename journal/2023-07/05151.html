	<body>
		<p class="cs95E872D0"><span class="cs1B16EEB5">In the line up, for free food.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">There was a old Indian lady in front of me.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Who reminded me of my mom.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">I imagined she was alive.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Old, grey haired, alone,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">standing in line for free food.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Just as she is.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">And this twisting sorrow.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
