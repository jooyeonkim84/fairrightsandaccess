		<p class="cs40314EBF"><span class="cs1B16EEB5">So Biden gets a type of diplomatic immunity while in power.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Despite all this abuse that was done on me.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Public display goes on. Cyber-bullying only enhanced since Anna.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">You&#39;re all in it together laughing, mocking your way.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Is it really a great idea?</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
