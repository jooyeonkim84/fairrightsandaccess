		<p class="cs95E872D0"><span class="cs1B16EEB5">Now if some of this is part of an &#39;experiment&#39; on a person.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">That too, is a felony. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">A person is not given the link, monitored, released in the public display,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">targeted. You create that environment of harm.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">And to further attempt control, or affect, by exploiting the situation?</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
