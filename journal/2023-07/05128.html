		<p class="cs95E872D0"><span class="cs1B16EEB5">Do understand, that this was not a &#39;canon&#39; event.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">It began as a choice by the top authority,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">despite having other options,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">despite recognizing my suffering, my fighting them for my rights.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">It was forced on me, and it is still.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">And they must be charged for what they did here.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
