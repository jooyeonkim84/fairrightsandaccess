		<p class="cs95E872D0"><span class="cs1B16EEB5">...but despite wearing slippers and pajamas,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and not all that up for a fight.....</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">i have become.... quite a wuss.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">is courage something you lose</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">to build up again?</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">probably.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and while i accept fights.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">no longer am i brave as i used to be. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">long ago...........</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
