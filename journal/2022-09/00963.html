		<p class="cs95E872D0"><span class="cs1B16EEB5">Apparently the top portion of my big toe, its skin</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">was ripped off from contact with the cement</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">when the idiot tackled me to the ground. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">now some cotton from the bandage stuck on it</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">excruciating to take it off. limping. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
