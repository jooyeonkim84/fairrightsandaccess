		<p class="cs95E872D0"><span class="cs1B16EEB5">Who watches the watchers?</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">And if these watchers have hardly better intent.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">I am kept in this situation watched.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Sent no help. Gaslit by everyone. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">A massive conspiracy, me vs the world.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
