		<p class="cs95E872D0"><span class="cs1B16EEB5">and... no.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">one cannot blame his actions on his mental illness.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">he did all this in his wake. fully conscious of his actions.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">part of how he was raised, &#39;hood&#39; mentality is my guess.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">i&#39;ve seen behavioral patterns similar before.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">many things he has done. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">but you got my point. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
