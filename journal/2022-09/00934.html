		<p class="cs95E872D0"><span class="cs1B16EEB5">When Pasai once said,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&quot;they don&#39;t know you like we do&quot;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">on my family.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">he was right.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">my family did not know me.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">they chose not to know me.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and once near,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">another form of subjugation.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">keeping me in comparison.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">setting my limits.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and some of them *wanted to.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">not the people to get near.</span></p></body>
