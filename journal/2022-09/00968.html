		<p class="cs95E872D0"><span class="cs1B16EEB5">And please understand that I have nothing to gain</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">but everything to lose by antagonizing Mr Musk.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">However, I cannot work with this strangling evil.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">And when I use the word &#39;evil&#39;. I don&#39;t believe</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">at this point is an exaggeration. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">This person is missing something as a human being.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
