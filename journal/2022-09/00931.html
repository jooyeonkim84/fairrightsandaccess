		<p class="cs95E872D0"><span class="cs1B16EEB5">and... of course,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">as i stated before.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">if monetary compensation means Adam&#39;s </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">punishment for harassment and destruction</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">is significantly reduced or trade-off,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">then i would forfeit the compensation.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">no excuses he is making is valid.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">nor any connected to him. </span></p></body>
