		<p class="cs95E872D0"><span class="cs1B16EEB5">Adam. Were you the one who </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">disconnected me from the internet at the shelter?</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">If so, bring me back in. All devices.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">I can&#39;t walk all the way to the library</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">for the internet sometimes.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Like my toe right now for instance.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">You are making my life incredibly inconvenient.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
