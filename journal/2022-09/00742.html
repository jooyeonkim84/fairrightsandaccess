		<p class="cs95E872D0"><span class="cs1B16EEB5">Nevermind Mark showing respect or not.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">His choice.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">But the communication towards me,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">while all this was going on.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">This was clearly encouragement for Adam&#39;s actions.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">And his involvement should be counted for. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">I don&#39;t think negligence, failure to report</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">the crime that was it. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
