		<p class="cs40314EBF"><span class="cs7A571DDB">&quot;I asked and God said, no.&quot;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">Well, Steve is lying.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">You will know that by your observations.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">Of the situation, stakes, timing,</span></p><p class="cs40314EBF"><span class="cs7A571DDB">motivations, all wouldn&#39;t make sense.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">Sorry, if I got that relay wrong.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">In any case, worst of human beings</span></p><p class="cs40314EBF"><span class="cs7A571DDB">and worst of the attackers there. </span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p></body>
