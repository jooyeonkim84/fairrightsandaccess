		<p class="cs40314EBF"><span class="cs1B16EEB5">But it is undeniable Mr Musk is helping my enemies and antagonizing me, cornering me in unfair ways. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">So after all these series of abuse, I can&#39;t forgive him either. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Not that at this point, my forgiveness matters.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">It&#39;s what the law knows as malice. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">That he will be punished for.</span></p></body>
