	<body>
		<p class="cs40314EBF"><span class="cs1B16EEB5">Watch for lies. Endless brazen lies. No shame. No conscience.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">This is what they are.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">I am right here. I am exploited. I am abused. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">What you see my work. My ideas.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">I trusted. I tried.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">There must be punishment to my attackers.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Their lethal intent.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">To destroy my life.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
