		<p class="cs40314EBF"><span class="cs1B16EEB5">King Charles, honestly, if you pass away.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">I might be left here forever.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">You can&#39;t rely on myself to get into the channel.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">So it would be a good idea to let me in.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">The authorities in the States appears to be helping...</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">But.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Overall, this feels like an unending cycle....</span></p></body>
