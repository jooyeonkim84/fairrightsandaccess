		<p class="cs40314EBF"><span class="cs1B16EEB5">&quot;Kill the what?&quot; </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Shut up Ricky Gervais.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">You try and save them at my expense, my suffering.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">You don&#39;t have the right.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Mind your own business.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">The law will decide everything it has done,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">and its continued intent.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
