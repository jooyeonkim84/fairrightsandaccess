		<p class="cs40314EBF"><span class="cs1B16EEB5">The worst thing you can do, is to mislead with false hope, girls.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">And state later on, it was all a hoax.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">The shock can destroy a person.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Rather, let me know immediately in this state.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Then it would be bearable.</span></p></body>
