		<p class="cs40314EBF"><span class="cs1B16EEB5">Bulmar&#39;s face coming up again.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">in that link.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">screenshot.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">No. If it is claiming my knowledge is his, </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">or it derived from him, it is lying.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Just ask Suhail,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">ask Bryan,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">what I knew. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">When they come up online.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Fucking evil idiots.</span></p></body>
