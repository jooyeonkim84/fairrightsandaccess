		<p class="cs40314EBF"><span class="cs1B16EEB5">Just got my package from downstairs.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">The protective cover wasn&#39;t what I was looking for.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Need to buy new. That&#39;s another 15 dollars.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">And I don&#39;t have the money.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">How long am I suppose to live this way.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Can&#39;t move forward in life.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Get me in there.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Let me talk.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
