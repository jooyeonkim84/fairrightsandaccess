		<p class="cs40314EBF"><span class="cs7A571DDB">Seeing Ed Sheeran&#39;s Don&#39;t/loyal.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">My apologies on the suspicion to the court then. </span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">I&#39;m blind and my survival is about thinking the worst.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">This is how I defend myself. </span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">If otherwise, I will miss it.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">If I trust and think positive with the court&#39;s ruling. </span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p></body>
