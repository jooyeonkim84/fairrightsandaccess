	<body>
		<p class="cs40314EBF"><span class="cs1B16EEB5">They knew better than that.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Better than their actions. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Not to do such things.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">And all that justification is but framing.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">They are pure evil. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">What remorse or regret do you see in them?</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Nothing.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">As they go on pursuit of harm.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
