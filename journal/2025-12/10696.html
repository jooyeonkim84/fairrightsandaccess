	<body>
		<p class="cs40314EBF"><span class="cs1B16EEB5">Ever trying to buy time, ever trying to control by deceit, fraud. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Why are you people like this? </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">What is the point of this trials, measuring right and wrong,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">if you are going to rig it in the end? </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">That will result in catastrophe.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">You will not get away with manipulating power.</span></p></body>
