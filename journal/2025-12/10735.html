		<p class="cs40314EBF"><span class="cs1B16EEB5">You do realize why I am going insane and yelling out profanity, threats, right?</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">It&#39;s because you people allow this abuse. Endlessly.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">What the fuck is wrong with you?</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">It is time to cut them off. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">It is time to deliver punishment. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Do you &nbsp;understand that?</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
