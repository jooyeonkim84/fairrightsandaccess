		<p class="cs40314EBF"><span class="cs1B16EEB5">Correction, &quot;wishing&quot; isn&#39;t so much a threat. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Nor is self-defense in retaliation from unending abuse.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Don&#39;t turn anything against me.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">As you people endlessly allow their fucking with my life and my mind.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">That fucking court is evil itself.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">And you need clean it up.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
