		<p class="cs40314EBF"><span class="cs7A571DDB">Whichever &#39;God&#39; one believes is one&#39;s own choice.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">However, in Elon&#39;s case.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">It is delusion and it has much to do with his ego.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">And deceit and vanity as well.</span></p></body>
