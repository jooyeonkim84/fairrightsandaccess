		<p class="cs95E872D0"><span class="cs1B16EEB5">I am seeing Mr Bezos&#39; followers</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">change from 122 to 124.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">As I write.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">So my assumption may in fact be correct</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">here as well.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">If that is the case,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and if the corruption is clear,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">then I hope they will be brought to</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">justice.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
