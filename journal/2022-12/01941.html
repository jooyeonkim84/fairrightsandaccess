		<p class="cs95E872D0"><span class="cs1B16EEB5">There is no way out of it.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">The evidence(s) are clear.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">It&#39;s left a trail, and if he isn&#39;t punished,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">it will be re-addressed again and again.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">The guy is a killer, make no mistake about that. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
