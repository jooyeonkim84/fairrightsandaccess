		<p class="cs95E872D0"><span class="cs1B16EEB5">and yes, it&#39;s their fault.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">I&#39;m still here blind and getting attacked.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">What honor do you see in creating conspiracy</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">behind someone who is blind to what is going on</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">(thus you can buy time and do whatever you want)</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and unable to fight back?</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Stop. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Just stop.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
