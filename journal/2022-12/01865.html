		<p class="cs95E872D0"><span class="cs1B16EEB5">I forgot it&#39;s Christmas and nobody is reading this.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Well, I hope it&#39;ll be addressed at some point in the future.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">The police there at North York. What they did - or allowed doing, </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">wasn&#39;t right. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Hopefully no more of this abuse this coming new year. </span></p></body>
