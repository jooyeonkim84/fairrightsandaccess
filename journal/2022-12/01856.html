		<p class="cs95E872D0"><span class="cs1B16EEB5">If an negative opinion is made on a person,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">that is usually caused by a issue shared with the person.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">If the person was being nice upfront,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and backstabbing for no apparent reason,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">that is called slander. It is not an opinion,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">but simply attempting harm.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">xD</span></p></body>
