		<p class="cs95E872D0"><span class="cs1B16EEB5">If it were up to me,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">i&#39;d proceed with the capital punishment. On Steve.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">But it appears it is not. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">XD</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">It&#39;s not only what he did. But how he did it as well.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">In the beginning, with his brother. It was something like the Klan. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Pursuit to destroy.</span></p></body>
