		<p class="cs95E872D0"><span class="cs1B16EEB5">Whatever excuses David is making,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">it is irrelevant.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Assault is assault. And intent of harm.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">And I have suffered through, all that time I was in the house.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
