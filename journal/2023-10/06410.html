		<p class="cs95E872D0"><span class="cs1B16EEB5">If my profanity offends the authorities in charge</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">of this &#39;choice&#39;. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Should it make a difference?</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">It&#39;s been five years.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Exploitation, harassment, it just continues.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">And excuses, impossible excuses.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">When exactly is that you&#39;re going to defend someone who is in the weak?</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
