		<p class="cs95E872D0"><span class="cs1B16EEB5">A hate crime based on prejudice. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">And it is persisting. Relentless pursuit.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Charges should be clear.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">To be clear, Sean Kernan has tried framing me few times. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Trying to turn the table around I believe. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Full charges on him and his friends as well. </span></p></body>
