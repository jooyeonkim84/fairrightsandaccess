		<p class="cs40314EBF"><span class="cs1B16EEB5">&quot;2 hours of boogie woogie&quot;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">and from the 3 steps, you took out one.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">What is it? They are all important. Remember this.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">These people they, try to discredit you,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">and that is not only against me,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">but against the world. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">And this is for their benefit.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">It must be accounted for as harm and intent.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
