	<body>
		<p class="cs40314EBF"><span class="cs1B16EEB5">Going to be exploited, and used. Endlessly.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Risking my life. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">And no punishment is given.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">This court is corrupted. Whoever was the decisive person on this outcome.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">AFTER all we&#39;ve gone through.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">And STILL alleviated them.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">THIS PERSON DESERVES THE PUNISHMENT. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
