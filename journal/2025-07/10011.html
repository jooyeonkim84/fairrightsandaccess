		<p class="cs40314EBF"><span class="cs1B16EEB5">Going to need your help Royal family.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">When they try to counter, read my statements and expand on it with your observation on their deeds. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">We are fighting this together.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Authorities must recognize we are fighting for honor, our rights. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Over their deceit, framing, force. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
