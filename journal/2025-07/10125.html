		<p class="cs40314EBF"><span class="cs1B16EEB5">And this deal, whether it goes through or not.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">HAS NOTHING TO DO WITH THEIR INCRIMINATION.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">That&#39;s &nbsp;not part of the negotiation.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">This is a criminal court of justice.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Business is separate.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Ok?<br/><br/><br/>You exploit, you mingle things up.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Try and use us.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Then you are criminals. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
