		<p class="cs40314EBF"><span class="cs1B16EEB5">does his deeds and conduct even listed in this court of law?</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">everything he has said and done? </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">count them all.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">there has always been the factor of cruelty over what was unnecessary. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">i was enslaved. and tortured.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">be clear about that.</span></p></body>
