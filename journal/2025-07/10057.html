		<p class="cs40314EBF"><span class="cs1B16EEB5">ROFL.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">I suddenly died?</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">What the fuck is wrong with this?</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">If I were to die, I would have died long ago, and stayed there.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">So who is framing or forcing this on to me?</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Whatever is going on,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">let&#39;s not waste our time.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Get to the bottom of it, and refine.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Don&#39;t let these people repeat cycle.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
