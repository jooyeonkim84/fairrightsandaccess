		<p class="cs40314EBF"><span class="cs1B16EEB5">Would they be trying to turn the table around, </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">trying to destroy me still, by whichever way.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">if they were genuinely remorseful of their actions?</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Of course not.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">They haven&#39;t learned a thing.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">These are criminally wired people, and they deserve their charges.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
