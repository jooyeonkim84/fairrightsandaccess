		<p class="cs40314EBF"><span class="cs1B16EEB5">I can&#39;t say ideas come dime a dozen.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">But it is frequent, when you ready yourself. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">And I am not here to steal anyone&#39;s work. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">And I think I mentioned it was from Indian Steve before. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">I can&#39;t remember. Maybe I made a mental note and forgot about it. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">But there certainly is no malice. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
