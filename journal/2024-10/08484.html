	<body>
		<p class="cs40314EBF"><span class="cs7A571DDB">아무도 믿을수가 없구나....</span></p><p class="cs40314EBF"><span class="cs7A571DDB">난 이리 고여있는데,</span></p><p class="cs40314EBF"><span class="cs7A571DDB">다른 이들은 세월과 함께 한없이 흘러가고.....</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">7년짼데...</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">아무도 나를 도와주지 않네...</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">때론 정신 이상이 오는것 같기도 하고...</span></p><p class="cs40314EBF"><span class="cs7A571DDB">온 세상이 나를 가지고 놀고 있고....</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">잔인하다...</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">정말 잔인하다....</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p></body>
