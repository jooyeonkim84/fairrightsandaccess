		<p class="cs40314EBF"><span class="cs7A571DDB">지혜를 먼저 만났었다면, 이런 문제가 없었을텐데...</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">근데 솔지히 지혜가 어렸을땐 또... 그리 이쁜 외모는 아니였던것 같음.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">엄청 귀엽긴 한데.... </span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">지금하고는 비교가 안됨.....</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">보니까 성형을 확실히 않한것 같음......</span></p></body>
