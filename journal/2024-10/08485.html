	<body>
		<p class="cs40314EBF"><span class="cs7A571DDB">그나저나 크리스티나 애 때문에 돌것 같습니다....</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">이게 장난인지, 현실인지...</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">내가 아무리 외국에서 자랐다고 해도, </span></p><p class="cs40314EBF"><span class="cs7A571DDB">장난끼가 많다고 하더라도,</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">이런 부분에서는 한국 사고가 정확한 사람인데...</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">이걸 받아 들여야 되는지....</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">한숨 밖에 않나옵니다.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">이쁘면 다냐 정말. 씨........</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">왜 사람을 계속 괴롭히는지...</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">마음이 갈라져 있으면 그냥 나를 보내지. </span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">아... 정말 난 여자 복이 없습니다...</span></p></body>
</html>
