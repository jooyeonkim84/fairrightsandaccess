		<p class="cs40314EBF"><span class="csF9DFFDD3">전지현씨... 엄청 부자이신데...</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">오양 참치캔 3 박스,</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">너구리 라면 3 박스,</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">이리 보내주시면....</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">&nbsp;</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">제가 평생 누님으로 모시고... 프라토닉하게...</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">&nbsp;</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">부탁 드립니다....</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">&nbsp;</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">배고파요....</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">&nbsp;</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">먹을게 없습니다...</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">&nbsp;</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">영화 보면 그지 애들 피자 사주시던데.......</span></p></body>
