		<p class="cs40314EBF"><span class="cs7A571DDB">한국분들, </span></p><p class="cs40314EBF"><span class="cs7A571DDB">한국에 무료 인터넷 천지 아닙니까?</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">중고 휴대폰 하나 사가지고, </span></p><p class="cs40314EBF"><span class="cs7A571DDB">전자우편 아카운트 gmx.com 같은데서 하나 만들어서,</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">나한테 링크 보네요.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">그 휴대폰은 버리고. </span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">아무도 모릅니다 정말. </span></p><p class="cs40314EBF"><span class="cs7A571DDB">문자를 보내던지,</span></p><p class="cs40314EBF"><span class="cs7A571DDB">우편 편지 보내던지....</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">전지현씨. 좀 도움을 주시면 않될까요?</span></p><p class="cs40314EBF"><span class="cs7A571DDB">내 이 우정을 친구로서 잊지 않을것입니다...</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p></body>
