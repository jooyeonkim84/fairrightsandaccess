		<p class="cs40314EBF"><span class="cs7A571DDB">Mr Downey Jr. You seem to show this wanting to connect to me. </span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">Appreciate it in some way as a fan of your movies. It&#39;s an honor. In that way, strictly.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">At the same, you supported my enemy. </span></p><p class="cs40314EBF"><span class="cs7A571DDB"><br/>Do you think I will forgive this?</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">No. I will not. </span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p></body>
