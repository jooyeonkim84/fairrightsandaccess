		<p class="cs40314EBF"><span class="cs1B16EEB5">Why do you keep saying &quot;Keep your expectations low.&quot; King Charles.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">They are evil and self-centered people. Enough so that they would destroy another&#39;s life.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">No matter how else they feign it. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">They must be charged for what they have done and continue to do.</span></p></body>
