		<p class="cs40314EBF"><span class="cs7A571DDB">You&#39;re all dumb. You keep falling for their framing. </span></p><p class="cs40314EBF"><span class="cs7A571DDB">How many times? XD</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">You should know by now.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">Since long ago actually.</span></p><p class="cs40314EBF"><span class="cs7A571DDB"><br/>Why do I have to suffer for your lack of discernment.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">Sigh...</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">Kindly see to it again and finalize.</span></p></body>
