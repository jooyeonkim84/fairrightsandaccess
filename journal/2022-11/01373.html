		<p class="cs95E872D0"><span class="cs1B16EEB5">slept well yesterday.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">feeling a bit better today.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">however pressure in my ears,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">often this high-pitched noise prevails.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">dizzyness continues.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">it&#39;ll be a while before it&#39;s better...</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">trying to:</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">1. avoid junk food.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">2. get enough rest.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">3. too much movement. eyes or otherwise.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
