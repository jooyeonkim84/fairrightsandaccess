		<p class="cs95E872D0"><span class="cs1B16EEB5">people speak out about this.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">if i got into a fist fight with you,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and if you were losing,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">why the hell would you attack my family? </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">that is the definition of cowardice,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">that is the definition of CRIME.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">completely unrelated, they tried</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">attacking a person through the &#39;heart&#39;. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
