		<p class="cs95E872D0"><span class="cs1B16EEB5">are these two on the seriously autistic side?</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">i have no idea.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Adam is a full-on criminal, no doubt about that.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">i&#39;ve warned Zuckerberg not to join in on this game</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">prior as well. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Silicon Vally must be full of idiots trying to</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">destroy each other over competition. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
