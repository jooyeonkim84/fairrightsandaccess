		<p class="cs95E872D0"><span class="cs1B16EEB5">Mr Musk, you do have the power to change my life for the better</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">in an instant.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">How about getting me that apartment,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and following 10% of profit from Twitter, monthly by paycheck?</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">So I can eat lots of meat,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and buy the equipment i need...........</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Come on man.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
