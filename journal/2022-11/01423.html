		<p class="cs95E872D0"><span class="cs1B16EEB5">people appear to be focusing on the assumptions i got wrong.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">instead approaching the holistic/whole of the view.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">bottom line: it&#39;s his big mouth, even after all was good.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and my attempts to defend myself, to repair the damage was</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">met with hostility. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
