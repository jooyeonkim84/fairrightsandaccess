		<p class="cs40314EBF"><span class="cs1B16EEB5">...and there is no way, Steve can get away with this. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Court is based on evidence, not slander or lies.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">If he is making up reasons for his attacks. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">See also contradictions and timing as well. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">And the evidence that follows. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Nothing he says should make sense. </span></p></body>
