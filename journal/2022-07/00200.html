		<p class="cs95E872D0"><span class="cs1B16EEB5">don&#39;t know why these people believe</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">they can get away with it after</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">admission of crime,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">then repeating themselves </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">hundred times following.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">don&#39;t make it worse for yourselves,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">admit what you did,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and come up with reasons on why.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
