		<p class="cs95E872D0"><span class="cs1B16EEB5">Must I state the obvious?</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Is there anyone there in my defense, instead these ignorant,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">or deliberately ignorant people defending their obvious crime</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">with forced reasoning?</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">There is NO EXCUSE for what they&#39;ve done.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">There is NO EXCUSE for Mr Biden&#39;s actions of justifying their crime. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
