		<p class="cs95E872D0"><span class="cs1B16EEB5">seeing the relays...</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">that day when a car that was completely shielded by a coating</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">of sort (front glass), so i couldn&#39;t see the driver - </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">parked in front of this house.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and left as i came near.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">i think that may have been Mr Musk.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">who knows...</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
