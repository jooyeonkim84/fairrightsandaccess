		<p class="cs95E872D0"><span class="cs1B16EEB5">what to do...</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">waking up everyday feeling this sense of being lost.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">opposite to the sense of belonging.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">like a drifter.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">always have been but more prominent. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">even if to have a little shack made of cardboard boxes</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">i could call a home. xD</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
