		<p class="cs95E872D0"><span class="cs1B16EEB5">And it doesn&#39;t matter what reason it is.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">If Mr Musk don&#39;t help, that in it itself is abuse.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Support should&#39;ve been done long ago.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">I made myself clear. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Please look into this, and counter whatever excuse he is making.</span></p></body>
