		<p class="cs95E872D0"><span class="cs1B16EEB5">Nah. Adam, what you did.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">People will recognize.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">You are one of the worst.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">You should realize by now,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">where this path is leading to.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">In the end, it&#39;s all about</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">whether you are a threat to society or not.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">You are.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">You are a menace.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
