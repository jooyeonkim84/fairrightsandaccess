		<p class="cs95E872D0"><span class="cs1B16EEB5">Please understand that my mother&#39;s condition is irrelevant</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">to what they (Robert, Becky, Sean, Anna) attempted.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">If the question is how can you harm someone who is already dead.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">You can. She&#39;s not dead in my eyes. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">What they were targeting was me.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">That is clear.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
