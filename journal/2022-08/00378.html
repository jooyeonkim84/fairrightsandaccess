		<p class="cs95E872D0"><span class="cs1B16EEB5">I think despite our previous conflict,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Romeo would agree that </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">there are some crazy/dangerous people here.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">And what Adam is doing -</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">it can only lead to harm.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
