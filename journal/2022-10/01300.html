		<p class="cs95E872D0"><span class="cs1B16EEB5">you people are falling for her dual,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">contradiction. she plays both the good and bad.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">but understand this. behind love,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">there cannot be the &#39;bad&#39;.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">both do not co-exist.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">that&#39;s just fucking evil.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">no she&#39;s not eccentric or nuts.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">she planned these things,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and hides the intent.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
