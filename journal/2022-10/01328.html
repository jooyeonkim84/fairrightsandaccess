		<p class="cs95E872D0"><span class="cs1B16EEB5">Why these people toying with my life,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">it&#39;s okay for them to do this?!</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Mr Musk has no right to demand more of me -</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and Mr Gates, if you&#39;re toying with someone&#39;s heart -</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">you belong in hell. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">What happened to my mom you fucking idiots!!!!</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">TELL ME!!!!</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
