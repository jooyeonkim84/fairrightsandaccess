		<p class="cs95E872D0"><span class="cs1B16EEB5">So I don&#39;t know what the outcome is.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">It seems like he was in trouble yesterday,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">now he doesn&#39;t seem to be.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">I don&#39;t think his defenses,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">whatever they are. Can&#39;t connect.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">His actions intentionally revolve around </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">one common factor and that is &#39;deception.&#39;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">That is intentional harm.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
