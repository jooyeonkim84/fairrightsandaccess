		<p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">You ain&#39;t gonna die for telling the truth, Ryan.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Assuming that is one of Elon&#39;s sons in that relay.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Your dad creates victims, and in his mind sacrifice is justified.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">This is to a civilian who was just trying to impress him.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">There has to be justice.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">And life will go on for the better.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
