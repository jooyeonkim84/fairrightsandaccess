		<p class="cs40314EBF"><span class="cs1B16EEB5">i think im seeing my extended family attacking me as a group.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">kindly remind the authorities on what they have done.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">and that there are no lawful excuses to it.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">it was competitive lynching,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">and now it is for survival.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">they must be charged, fairly.</span></p></body>
