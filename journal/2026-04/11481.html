		<p class="cs40314EBF"><span class="cs1B16EEB5">&quot;God is training you to be ruthless.&quot;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">No need.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">I have learned what being &quot;nice&quot; leads me to. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">I will agree with your decisions of the court,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">if it means cold justice. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">If it means there will be no more dangers towards my life.</span></p></body>
