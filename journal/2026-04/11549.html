		<p class="cs40314EBF"><span class="cs1B16EEB5">This is not a person who can be forgiven.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Vanity and abandon of integrity in lethal ways.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Targeting a life.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Please understand the horror behind that psychology.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">It is void of conscience that acts by deceitful impulse for the joy of it.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">A lethal clown. Please understand.</span></p></body>
