		<p class="cs40314EBF"><span class="cs1B16EEB5">Also if Elon Musk justified &quot;slavery&quot; because it always existed everywhere.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">As I see in the relays.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">That&#39;s just plain evil.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Seeing evil triumph is when good men do nothing. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Self-justifying their actions. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">That is the evil in it, itself. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
