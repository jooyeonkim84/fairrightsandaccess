		<p class="cs40314EBF"><span class="cs1B16EEB5">Looks like Biden was framing me as well.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Whatever he sees as a threat, he will frame me for.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">or use some kind of propaganda to make me into the bad guy. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">See all those instances, if you will. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">I&#39;m just civilian. And I had to go through these impossible things. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Because of these people. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
