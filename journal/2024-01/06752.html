		<p class="cs40314EBF"><span class="cs1B16EEB5">By the way, if the plan is to make me into a scapegoat,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">thereby allowing Elon Musk to be free of his crimes,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">no that is wrong. Further, he&#39;s done so in different ways.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Not just a single attempt. He must be charged. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">I apologize for my speculation on this &#39;plan&#39;. </span></p></body>
