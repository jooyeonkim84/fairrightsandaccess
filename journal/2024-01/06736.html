		<p class="cs40314EBF"><span class="cs1B16EEB5">As for Elon Musk.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Don&#39;t mess around my enemies.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Have some damn sense of honor and don&#39;t invest into them.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">You don&#39;t need them, and you know it. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">You got a issue with me, you take it out on me directly.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Don&#39;t play the scum bag.</span></p></body>
