		<p class="cs40314EBF"><span class="cs1B16EEB5">And are they really the competitors, when they are the ones who wants to invest in my idea,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">and I am paying the taxes here? </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">It&#39;s vice-versa, we are benefiting each other. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">While helping out the world.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">So why are you people antagonizing each other?<br/><br/><br/></span></p></body>
