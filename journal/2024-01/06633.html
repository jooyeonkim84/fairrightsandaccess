	<body>
		<p class="cs40314EBF"><span class="csF9DFFDD3">BTS. 남준군에게 번역하라 하지말고 자신들이 영어를 배우시기 바랍니다. ㅋㅋㅋ</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">팁:</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">1. 모든 언어는 일반적인 대화 수준에서는 한 4000 단어 정도 안에. </span></p><p class="cs40314EBF"><span class="csF9DFFDD3">그것을 응식하면서,</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">&nbsp;</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">2. 한 사물을 바라보고 그것에 대한 다양한 문장을 만들어 낸다.</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">이후 그것을 정정할 도움과 함께. &nbsp;</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">&nbsp;</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">3. 대화로 사용한다. </span></p><p class="cs40314EBF"><span class="csF9DFFDD3">&nbsp;</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">물론 나는 어릴때 와서 이렇게 말할 권리가 없긴 하지만... ㅋㅋㅋ</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">&nbsp;</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">나도 이 나이에 뭔가 새로이 배워야 겠습니다... </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
