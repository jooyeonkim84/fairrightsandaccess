		<p class="cs40314EBF"><span class="cs1B16EEB5">Unrelated. Sounds like Steve is on the rise competitively.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Quite disappointed in you Adam. I thought you&#39;d do better. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">And again, unrelated to any competitive efforts,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">they should be charged for their crimes.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">And really, people.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Is 1000 a month too much to ask?</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Sigh...</span></p></body>
