		<p class="cs40314EBF"><span class="cs1B16EEB5">On Adam:</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">So this is why I say, Adam was fully in recognition of the situation.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">As in, he&#39;s seen the &quot;license plate&quot; and yet did nothing.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">And dare this person tries to hijack my ideas after he has been </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">part of the cause of my suffering?</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Kindly look through the writings at the time.</span></p></body>
