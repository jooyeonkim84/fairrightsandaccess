		<p class="cs40314EBF"><span class="cs1B16EEB5">Don&#39;t you all wish that you got rid of the criminals early? </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">They are wired to behave in a certain way,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">and they will only repeat. &nbsp;&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Character = predictable action. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">They won&#39;t change.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
