	<body>
		<p class="cs40314EBF"><span class="cs1B16EEB5">This &#39;human being&#39; supposedly, Steve.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">It wasn&#39;t human to me.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">From beginning to end.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">I can&#39;t dismiss this, nor should you. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">It is a parasite unending, unyielding,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">relentless evil. No limiter, no integrity.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Nothing.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">The law must see from the victim&#39;s eyes.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">My suffering can&#39;t be overruled.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
