		<p class="cs40314EBF"><span class="cs7A571DDB">Seeing &quot;Bryan Adams&quot; - &quot;Please forgive me.&quot;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">No way. Not at this point.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">ALL that chaos, because he hid the origins. </span></p><p class="cs40314EBF"><span class="cs7A571DDB">And as he exploits my ideas.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">As he sees me suffer, and being in devastating trouble.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">He stays silent. </span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">No. This is a menace. </span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">And so are the others. </span></p></body>
