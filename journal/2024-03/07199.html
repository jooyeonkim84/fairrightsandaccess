		<p class="cs40314EBF"><span class="cs1B16EEB5">Seeing &quot;tax hike&quot; initiated by Trudeau. That is targeting. It&#39;s again manipulation of the law.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Misuse of power. I will explore my legal options. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">He is making it into a war. Trying to suppress my rights.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">He must be charged for all those crimes that he has already done.</span></p></body>
