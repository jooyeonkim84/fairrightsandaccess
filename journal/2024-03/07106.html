		<p class="cs40314EBF"><span class="csDC4A80">I&#39;ve written some important things today. </span></p><p class="cs40314EBF"><span class="csDC4A80">I hope everyone is paying attention. </span></p><p class="cs40314EBF"><span class="csDC4A80">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">It&#39;s the inevitable outcome.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">I am merely solidifying it by stating that it must be asserted with the written law. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">So we follow that written law without deceiving ourselves or others.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
