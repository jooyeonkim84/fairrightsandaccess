		<p class="cs95E872D0"><span class="cs1B16EEB5">Having watched a youtube thumbnail,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">it looks like chain &#39;belts&#39;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">can wrap around a tree </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">adjust to its shape </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and cut it without worries of &#39;pinching&#39;. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">as it has depth,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and many bending points.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">but robotic arms and drilling points would be better for automation....</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
