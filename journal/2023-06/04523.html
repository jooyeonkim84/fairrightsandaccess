		<p class="cs95E872D0"><span class="cs1B16EEB5">from edm wire cut out insert,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">small opening in cube,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">drilled to allow the wireless signal through,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">sensor however must not be subjected to pressure.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">so the way it is made hopefully can be durable.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">along with drilled holes too small (but many)</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">to dimish the effects of pressure hopefully.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
