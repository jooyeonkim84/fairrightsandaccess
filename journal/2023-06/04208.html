		<p class="cs95E872D0"><span class="cs1B16EEB5">The answer will arrive,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">as the machines become of use,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">on Earth, Mr Musk.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">My guess is that,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">there will still be people required.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">But for every feature automation,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">the less people there will be....</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Has to be built here and tested anyway........</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">What works here, works in Mars.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
