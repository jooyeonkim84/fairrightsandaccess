		<p class="cs95E872D0"><span class="cs1B16EEB5">and of course.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">eventually, the radiation</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">must be shielded,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">studies in strengthening </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">the electromagnetic field,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and its application -</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">in this case, probably with</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">lasers from the orbit...</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
