		<p class="cs40314EBF"><span class="cs1B16EEB5">And Mr Musk, </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">why do you leave it like this, and being happy about the situation?</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Why do you not send support? </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Let me get that apartment. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">The thing is that you are enjoying my suffering. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">That much is clear.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">While you believe it is funny. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Most always.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">It is not. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
