		<p class="cs40314EBF"><span class="cs1B16EEB5">In any case,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">I trust everything will be in order. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">However, what I do not get, is taking of my basic rights.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">And setting me in danger, exposed of my address and where I go.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Like I said before, there are crazy people.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">And you are gambling with my life.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
