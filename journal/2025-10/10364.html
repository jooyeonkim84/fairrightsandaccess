		<p class="cs40314EBF"><span class="cs7A571DDB">--------</span></p><p class="cs40314EBF"><span class="cs7A571DDB">Unrelated.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">저는 요즘 릴레이에 떠올리는 한가인씨 도플갱어를 보고 놀랐습니다.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">그리고, 한가인씨가 이후 병원에 입원을 하셨다고 보았습니다.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">헌데, 한가인씨 남편님분은 생각을 해보셨는지...</span></p><p class="cs40314EBF"><span class="cs7A571DDB">그 얼마나 마음고생을 하셨겠어요.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">난 여자가 자신의 얼굴이, 자신 아버지 얼굴, 그 면적만 닮아도 멀리하고 싶은데...</span></p><p class="cs40314EBF"><span class="cs7A571DDB">얼마나 힘드셨겠습니까...</span></p><p class="cs40314EBF"><span class="cs7A571DDB">부디 남편분도 생각해 주시고, 그러세요... T_T</span></p><p class="cs40314EBF"><span class="cs7A571DDB">참 무서운 일입니다....</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">우스개 소리 입니다. ㅋㅋㅋ</span></p><p class="cs40314EBF"><span class="cs7A571DDB">근데 좀 무섭긴 하네요.... </span></p></body>
