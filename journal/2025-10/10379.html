		<p class="cs40314EBF"><span class="cs1B16EEB5">Insane as he may be, authorities.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Zuckerberg must still pay for his crimes. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Whichever the punishment.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Complete alleviation is your preferential treatment,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">and I do have a say in this as well, as the victim.</span></p></body>
