		<p class="cs40314EBF"><span class="cs7A571DDB">It&#39;s hilarious.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">They do all the wrong.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">And you make me into the scapegoat.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">Instead punishing their attempts to destroy my life.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">When I am only ever reciprocating. </span></p><p class="cs40314EBF"><span class="cs7A571DDB">IN self-defense.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">Elon Musk, must be charged.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">There is no way out of this.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p><p class="cs40314EBF"><span class="cs7A571DDB">This is a diabolical person.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">A lethal one.</span></p></body>
