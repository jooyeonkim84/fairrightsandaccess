		<p class="cs40314EBF"><span class="csF9DFFDD3">만약 너희들이 내 지적 자산, 내 아이디아들을 훔치려 한다면,</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">너희들은 저승길이다. 손영석. 인희. 잘 들어라. </span></p><p class="cs40314EBF"><span class="csF9DFFDD3">&nbsp;</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">Writing to the brother in law and my sister. If they are trying to steal my intellectual property, my ideas. Then they are on the path to afterlife. </span></p><p class="cs40314EBF"><span class="csF9DFFDD3">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
