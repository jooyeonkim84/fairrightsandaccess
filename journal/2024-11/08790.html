		<p class="cs40314EBF"><span class="cs1B16EEB5">You just kind of, bury it inside yourself and go on.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">If it&#39;s too painful.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Doesn&#39;t fully heal, you just kind of scar and live with it. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">But I suppose over a very, very long time.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">A lifetime perhaps. Things can heal. Who knows.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">But not every pain.</span></p></body>
