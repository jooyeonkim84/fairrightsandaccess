		<p class="cs40314EBF"><span class="cs1B16EEB5">Kindly do not blame the community for Steve&#39;s deeds, if you are.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">For does it confess? Or stop? It continues. Nothing has changed. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">It deserves the punishment.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Every action was intended to destroy my life, one form or the other.</span></p></body>
