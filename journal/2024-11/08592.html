		<p class="cs40314EBF"><span class="cs1B16EEB5">No it can&#39;t be &quot;no man&#39;s land&quot;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">you are missing an angle. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">It&#39;s the same as everything else.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Whatever it is.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">This person is creating doubt. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">That is what he is doing. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">It knows the devastating consequences of its actions on to me.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">It has no conscience.</span></p></body>
