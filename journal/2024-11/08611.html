		<p class="cs40314EBF"><span class="cs1B16EEB5">I &quot;killed&quot; King Charles? <br/></span></p><p class="cs40314EBF"><span class="cs1B16EEB5">What is going on?<br/><br/><br/>I drop all charges then. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">He&#39;s been helping, and his intent is what counts. If he would eventually contact.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">No matter what. If that is what he&#39;s being charged with.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">-------</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Adam sends:<br/><br/></span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">------</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Stop sending.</span></p></body>
