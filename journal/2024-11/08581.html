		<p class="cs40314EBF"><span class="cs1B16EEB5">Somewhat was a fan of Smallville. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Looks like Lex Luthor&#39;s mansion, &quot;&quot; was it,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">keeps being used again in films. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Missed the ending of Smallville. <br/><br/>Got to watch it some time...</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Wow, time just flies by.... </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">That was 20 years ago....</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Thank you all for being there. Appreciate it.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
