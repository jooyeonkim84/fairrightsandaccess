		<p class="cs40314EBF"><span class="cs1B16EEB5">Ms Kelly Battles should not be supporting Adam.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">When I said he does not need to intervene, yet the attacks went on, and he callously did nothing. When he held the keys as the admin.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Then at least half the responsibility still falls on to him.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
