		<p class="cs40314EBF"><span class="cs1B16EEB5">Please keep it real.<br/></span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Please do not use your lenience or imagination to favor that good in yourselves.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">The result is my damage.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">You would be doing so, on my behalf. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">But I have a say in this, as the victim.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">In my self-defense.</span></p></body>
