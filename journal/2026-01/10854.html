	<body>
		<p class="cs40314EBF"><span class="cs1B16EEB5">&quot;Your life is in danger.&quot;<br/><br/>Because of you.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">You make me into a target, </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">without my privacy,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">trapped and locked in,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">and escalate the situation. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">The longer you do this,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">the more I am in danger.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Give me my freedom.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
