		<p class="cs40314EBF"><span class="cs1B16EEB5">&quot;They plan to sabotage your life because you choose to walk away.&quot;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Criminals in pursuit.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Must be charged.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Why do you fuckers do this? </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">What part of live and let live do you not understand? </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Whatever that is, these people need to be charged.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">They&#39;re not going to stop. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
