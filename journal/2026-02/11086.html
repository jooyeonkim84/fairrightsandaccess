		<p class="cs40314EBF"><span class="cs1B16EEB5">Biden is guilty a thousand times over authorities.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Don&#39;t give him any lenience over cruelty and devastation that was never necessary.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">This man was EVIL.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Don&#39;t make excuses on that.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Please do not wrong me.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">You too Elon. You, Biden. Steve.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">You are diabolical evil.</span></p></body>
