		<p class="cs40314EBF"><span class="cs1B16EEB5">Adam&#39;s relay.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Sounds like everyone&#39;s my enemy.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Is this politics or the law?</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">This is court of justice against criminals.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">This is about protecting the weak.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Criminals are not the weak.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">There are no nationalities here.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Only crimes and the victims.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Please understand.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
