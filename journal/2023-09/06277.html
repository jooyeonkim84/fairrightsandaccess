		<p class="cs95E872D0"><span class="cs1B16EEB5">Keep in mind that while the diagram is showing a hollow hole in the middle,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">only the core cylinder is gone, and the shell still remains that enwraps around the cylinder.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Meaning, it will abide by the laws of aerodynamics. Not complete hollow hole, it&#39;s above surface fighting against wind.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
