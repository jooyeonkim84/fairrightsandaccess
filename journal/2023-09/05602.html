		<p class="cs95E872D0"><span class="cs1B16EEB5">There is an exchange system, a reward system, if a person is benefiting his employer,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">or business network. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">I am given nothing. Just observed and displayed in public, as if i&#39;m in the circus.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Please send support. I can&#39;t live like this.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Send some money. I have earned this.</span></p></body>
