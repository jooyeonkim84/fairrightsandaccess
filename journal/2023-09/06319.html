		<p class="cs95E872D0"><span class="cs1B16EEB5">watch for further abuse from Steve.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">see why it should result to capital punishment.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">see how it is fixated on unrelenting, </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">sick expressions of pursuit.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">something like this shouldn&#39;t be part of society.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">see how it began. don&#39;t let this go.</span></p></body>
