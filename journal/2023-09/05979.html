		<p class="cs95E872D0"><span class="cs1B16EEB5">The person who gave me the speakers,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">accidentally gave me one with faulty wiring.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">copper wires coming out of the elastic.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">tried fixing it, made it worse.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">i need to buy a separate audio cable for this.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">mountain to climb after climbing an mountain.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
