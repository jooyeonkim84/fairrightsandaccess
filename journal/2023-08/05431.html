		<p class="cs95E872D0"><span class="cs1B16EEB5">At some point, I am going to shut my mind off from these relays.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Focus on the work...</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Mr Musk, I have no idea what those relays mean. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">And I think it&#39;s best if I don&#39;t think about politics for now.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
