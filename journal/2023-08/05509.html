		<p class="cs95E872D0"><span class="cs1B16EEB5">Ignoring the law, and stating it doesn&#39;t care.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">And being on pursuit of harming a person. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">If not up to that point of punishment, he should serve time in the States </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and deported back to Canada after that serving for further punishment.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">I&#39;ve had enough of this.</span></p></body>
