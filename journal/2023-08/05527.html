		<p class="cs95E872D0"><span class="cs1B16EEB5">Sigh... David, bit more careful with the bangs please. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">I don&#39;t think this time was emotionally driven, just not so cautious.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">It is nothing to you, but to me, it&#39;s bit of a shockwave/vibration</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">that enters my ears. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Somehow in open space, that is okay but inside a room, it transfers.</span></p></body>
