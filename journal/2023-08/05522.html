	<body>
		<p class="cs95E872D0"><span class="cs1B16EEB5">Waking up. I see the bathroom sink plugged,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and the knob turned to the left/red.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Possibly David means I &quot;shut it&quot;,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">or &quot;shut up&quot;. No idea.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">If so. Very stressful. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Express yourself in the channel</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">without misleads.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">And no, whatever I got to say, I will say it.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">No other way.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
