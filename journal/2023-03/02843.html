		<p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;There is no justification for what they&#39;ve done,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and continue to do.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">If they&#39;re not stopped now,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and there are no sanctions for their actions,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">further penalty for repeated offense,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">they will continue.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">it is merely an opening for these parasites. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
