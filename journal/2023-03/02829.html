		<p class="cs95E872D0"><span class="cs1B16EEB5">Whichever way, keeping someone captive by</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">ANY nations is absolutely wrong.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">You had taken my rights before,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">you continue to do so.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">These people owe me money,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and you should be sending this to me right now.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">USA and Canada</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">I need the money from the attackers....</span></p></body>
