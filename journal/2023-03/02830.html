		<p class="cs95E872D0"><span class="cs1B16EEB5">Sure, sealed eco-system in a shell, spaceships and buildings will work.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">But that is surviving, not living.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Proper magnetosphere, followed by water, oxygen, eco-system of life of all kinds.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&#39;unlimited&#39; territory, natural resource. Is the way to go.....</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
