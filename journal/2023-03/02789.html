		<p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">That photo must be from the Ontario</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">farm/ranch. You are a very lucky</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">person Mr Musk. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">I was very lost at 17. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">And I guess forever since then. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">XD</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Academically, socially, financially.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">However. Guess I had some belief</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">in there&#39;s something better out there.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
