		<p class="cs40314EBF"><span class="cs1B16EEB5">It makes things worse and worse for me.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">KNOWING what others attempting.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">It amplifies that harm, by paving the way for them.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Do you see this?</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Count the instances.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Anna, </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Sean,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Steve,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Sheikh,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">or whomever else.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
