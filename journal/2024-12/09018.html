		<p class="cs40314EBF"><span class="cs1B16EEB5">&quot;no one mourns for the wicked.&quot;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">.........i&#39;m not wicked.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">just trying to do some good and ended up like this.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">people see me as a threat, because, </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">i see solutions in things...</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">it seems.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">that is not justified cause for all this evil.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
