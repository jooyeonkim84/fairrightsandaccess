		<p class="cs40314EBF"><span class="cs1B16EEB5">Suddenly so many things to do.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Need to breathe in and out. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Ok. One step at a time. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Remember. For them. It&#39;s 1 person they are targeting &amp; attacking. Fundamentally. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">For me, I am fighting back on MANY individuals. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">But I can be fast. If I focus.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Just need to keep going.</span></p></body>
