	<body>
		<p class="cs40314EBF"><span class="csF9DFFDD3">모든 지적 자산은 제것입니다. 제 아이디어들 이니 부디 오해 마시길 바랍니다.</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">만약, 단 하나라도 제것이 아니였다면, 지금쯤 고백하지 않았을까 합니다.</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">눈에 보이지도 않은 채널에서 뭔일이 벌어지고 있는지 제가 어떻게 압니까? </span></p><p class="cs40314EBF"><span class="csF9DFFDD3">다른 사람이 제시한 뭔가가 곂친다면 곧바로 법으로 처리 들어가는거죠. </span></p><p class="cs40314EBF"><span class="csF9DFFDD3">&nbsp;</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">정말 악질인 인간들이 그곳에 있으니. 모두 현혹되지 말길 바랍니다.</span></p></body>
