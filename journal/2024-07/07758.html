		<p class="cs40314EBF"><span class="cs1B16EEB5">what is this about &quot;sin of cremation of the dead&quot;?</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">when our hopes are in the clear?</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">do you plan on making me into a broken person?</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">am i to become a terrorist aiming at revenge?</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">please. you don&#39;t allow something like that to continue.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Biden should be hanged if he went on pursuit of this.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
