	<body>
		<p class="cs40314EBF"><span class="csF9DFFDD3">원기야. 니가 내 여자에게 찝쩍대고 있냐. </span></p><p class="cs40314EBF"><span class="csF9DFFDD3">이런 망할놈. 니 형수님을 넘봐?!</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">넌 동네 순대집 여성에게 대시를 하거라. </span></p><p class="cs40314EBF"><span class="csF9DFFDD3">&nbsp;</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">그건 그렇고. </span></p><p class="cs40314EBF"><span class="csF9DFFDD3">아직도 투자 관심을 못받았냐?</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">넌 공부를 많이 한 아이가 아니냐? </span></p><p class="cs40314EBF"><span class="csF9DFFDD3">머리가 나쁜건 아니고... </span></p><p class="cs40314EBF"><span class="csF9DFFDD3">한국 교육이 의심스럼구나.</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">원리 이혜가 아니고, 기억력 위주가 아닌지.</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">정확히 남 밑에서 일하기 좋게 만들어 놓은 교육 시스템이 아닌지... </span></p><p class="cs40314EBF"><span class="csF9DFFDD3">의심스럽구나....</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">&nbsp;</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">어려운 일이 아니다 원기야. </span></p><p class="cs40314EBF"><span class="csF9DFFDD3">그냥 니 시각에 문제다. </span></p><p class="cs40314EBF"><span class="csF9DFFDD3">잘 하길 바라고.</span></p><p class="cs40314EBF"><span class="csF9DFFDD3">내 여자에게 관심 보이지 말아라. </span></p><p class="cs40314EBF"><span class="csF9DFFDD3">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
