		<p class="cs40314EBF"><span class="cs1B16EEB5">From what I gather from the relays, </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Sounds like these people were working with Anna and Adam. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Anna&#39;s been at it since the beginning and didn&#39;t stop.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Adam deliberately keeps silent. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">If i&#39;m not wrong.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">It&#39;s been rigged to their advantage. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Instead being fair, addressing their crimes.</span></p></body>
