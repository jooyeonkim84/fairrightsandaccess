		<p class="cs40314EBF"><span class="cs1B16EEB5">It&#39;s been attacking the ship idea for years now.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Claiming that it&#39;s not going to work, deterring it.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Why?<br/></span></p><p class="cs40314EBF"><span class="cs1B16EEB5">It fears it, it seems.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">What an idiot. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Just STOP.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">STOP attacking.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
