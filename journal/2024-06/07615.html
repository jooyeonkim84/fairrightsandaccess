		<p class="cs40314EBF"><span class="cs1B16EEB5">&quot;Your son is in danger because...&quot;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Authorities, you can tell that to King Charles and Queen Camilla all you want,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">but they ain&#39;t gonna do anything. They&#39;ll leave it up to fate. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">You have to help me out here. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
