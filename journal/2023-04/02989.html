		<p class="cs95E872D0"><span class="cs1B16EEB5">the drill should be able to</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">move from left to right, </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">up and down,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and forward and back.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">so basically a robotic arm,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">but more on a fixed axis. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">for durability.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">drill bit can be changed over time.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">rest is about evasion of the tree as it falls.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
