		<p class="cs95E872D0"><span class="cs1B16EEB5">As for Mr Peter Lee, Mr Sope, </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and everyone else,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">I will give you more than I originally agreed with you,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">so please do not worry.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">I can&#39;t be specific on the amount yet </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">we can discuss this later.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
