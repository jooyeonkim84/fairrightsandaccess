		<p class="cs95E872D0"><span class="cs1B16EEB5">Just to be clear, buyer does not return item after</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">negotiating that it will be returned. Falling silent.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">I on the other purchase I made, will be returning</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">the item. And I asked permission initially to keep it,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and to be granted of this. Still, will return. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
