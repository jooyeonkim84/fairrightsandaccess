		<p class="cs95E872D0"><span class="cs1B16EEB5">it&#39;s rather ridiculously weak,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">these copper lining at the end of</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">every USB cords or </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">connections inside laptops,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">to connect the keyboards,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and displays to the mobo.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">These things should be made more durable...</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">In fact, everything should be.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">It should be lasting. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
