		<p class="cs40314EBF"><span class="cs1B16EEB5">first snow here. 11/09.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Ed, (sheeran)</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">I know you are saying to me don&#39;t/loyal on elon.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">but don&#39;t fall for it.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">If you are saying that on him.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">he is not someone you trust,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">no matter what help.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">you have no idea what kind of villain this is.</span></p></body>
