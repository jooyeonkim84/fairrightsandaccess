		<p class="cs40314EBF"><span class="cs1B16EEB5">this is a diabolical evil. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">and it is targeting my life, my ideas. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">and you will come to know all of that,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">if not already.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">if there are things left,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">please ask around. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">and eventually i will come around to it as well. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">but witnesses should remember.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">at least segments of my presentations. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
