	<body>
		<p class="cs40314EBF"><span class="cs1B16EEB5">You people can laugh about it all you want,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">charm your way into make-believe,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">alleviate yourselves as if it were nothing.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">But the fact stands.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">You deeds exist.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">And your intent to harm. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">There will be justice.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
