		<p class="cs40314EBF"><span class="cs1B16EEB5">if calling him animal is offensive to the law,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">i will restate it with &#39;animistic person&#39;.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">But by the merit of his actions, </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">core nature of who he is,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">these relentless, senseless acts of destruction,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">my description, holds true and accurate. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
