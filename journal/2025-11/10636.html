		<p class="cs40314EBF"><span class="cs7A571DDB">법륜스님.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">계으름과 나태함 아니라,</span></p><p class="cs40314EBF"><span class="cs7A571DDB">불안함과 불면증인 정신 질환입니다.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">이 인간들이 하루가 멀다고 사람을 계속 괴롭혀 되니까요.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">그것에 대해 답을 해야되고, 사람을 미치게 만듭니다.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">이 씨발것들이. 재판관이고 뭐고 사람을 정신 학대를 하면서 가지고 놉니다. </span></p><p class="cs40314EBF"><span class="cs7A571DDB">뭐라 한마디 해주세요.</span></p></body>
