	<body>
		<p class="cs95E872D0"><span class="cs1B16EEB5">No given authority, no power is worth it,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">if you take away my rights in this moment.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">My reputation, the misconception made on the public,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">by the few who decides to deliberately destroy my image.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">If you find this entertaining,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">then you are not treating me like a human being.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
