		<p class="cs95E872D0"><span class="cs1B16EEB5">Ok. So today, picking up writing device.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Listing things to sell again.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Hopefully some of it sells so</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">I can buy copper tape.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Then once it arrives, my research</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and writing begins.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Despite the general roadmap,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">I have to make better sense of it. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">In better detail. </span></p></body>
