		<p class="cs40314EBF"><span class="cs1B16EEB5">Steve. I have stolen nothing from you.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Stop. If you are framing still.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">We had our conflicts, that is unrelated to any business or ideas.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">But I did not deserve this type, or amount of hostility.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Stop. End this.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Confess.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">I am asking you as a human being.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
