		<p class="cs40314EBF"><span class="cs1B16EEB5">Still not believing, the genetic test. African ancestry? </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Did my sister test with 23andme program? </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">How did it come to that? </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Sad is the person who can&#39;t even see his own ancestry,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">lacking money to do so...</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Well, I will do what I can. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Need to setup a simple prototyping lab...</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
