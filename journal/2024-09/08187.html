		<p class="cs40314EBF"><span class="cs1B16EEB5">--------</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">And Mr Musk. Understand that people who steals another people&#39;s ideas.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">People like Steve. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Should not be allowed to compete.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">End of story.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">It&#39;s in your recklessness and ruthlessness, you allow this abomination to exist. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
