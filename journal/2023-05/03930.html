		<p class="cs95E872D0"><span class="cs1B16EEB5">My apologies on the &quot;Klan&quot; comment comparing Steve&#39;s prejudice</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and the harm that followed, stalking. Not to Steve. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">I mean apologies to everyone else. That was insensitive. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">I am not good with words often, apologies.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
