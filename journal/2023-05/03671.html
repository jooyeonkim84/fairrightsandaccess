		<p class="cs95E872D0"><span class="cs1B16EEB5">........hmph. my name in Korean means</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">to &quot;roam around and acquaint/network&quot;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">or, to &quot;Link&quot;. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Zelda games do relate to me a little bit. XD</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">orphaned boy running around.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">But I did network....</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">So I guess I lived up to my name in the end Mr Musk.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
