		<p class="cs40314EBF"><span class="cs1B16EEB5">Ok. Keep going to push myself to work. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">30 minutes, pick up food. <br/><br/>Photo and list things to sell. <br/><br/>Breathe. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Too much anxiety. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Working up the sanity to be productive. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Once the chores are complete,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">I am going to set a schedule and stick to it.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
