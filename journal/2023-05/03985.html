		<p class="cs95E872D0"><span class="cs1B16EEB5">I didn&#39;t think Mr Schwarzenegger would</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">figure out about my father&#39;s personality.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">I guess we share a bit similar past. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Well, I would like to think so. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Will learn from your past Mr Schwarzenegger</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and try rising above my weaknesses....</span></p></body>
