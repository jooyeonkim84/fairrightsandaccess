		<p class="cs95E872D0"><span class="cs1B16EEB5">On talking about the lifespan of people,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Patrick says:</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&quot;Wuw, people live long.&quot;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Can&#39;t remember exactly </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">but you may have said something like this.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Do you still believe that now?</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
