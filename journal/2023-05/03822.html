		<p class="cs95E872D0"><span class="cs1B16EEB5">So i&#39;ve given enough proof of his actions.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">And you have witnessed how relentless this guy is.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Despite me trying to be a better person </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and forgiving in the beginning.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">It simply comes from a place, whatever it was in him.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
