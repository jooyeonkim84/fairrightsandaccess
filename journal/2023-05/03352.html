		<p class="cs40314EBF"><span class="cs1B16EEB5">i may be a hobo.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">but i could be a magical hobo.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">remember this.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">do not mistreat a magical hobo.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">do what rich white people have been doing for hundreds of years</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">and donate to the little asian kid.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">why are you all forgetting your responsibilities? </span></p></body>
