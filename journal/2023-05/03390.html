		<p class="cs40314EBF"><span class="cs1B16EEB5">Just endless emotional torture.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Fully aware of what went on.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">It&#39;s just a joke to you. Everyone. <br/><br/>I&#39;m mistreated. No rights to speak of. <br/><br/></span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Even people who harm me, &nbsp;in the open like this.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">They get away. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">What is this?</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
