		<p class="cs95E872D0"><span class="cs1B16EEB5">Trying to make my own gym equipment</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">with duct tape and metal rods I picked </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">up in the streets. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Will probably need to re-design several</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">times. It is Spring, will become Summer.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Need to take advantage of the weather...</span></p></body>
