		<p class="cs40314EBF"><span class="cs1B16EEB5">&quot;Chosen one, your friends don&#39;t like you. They think you are evil.&quot;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">If this is Zuckerberg and Adam.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">From all i&#39;ve observed. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">From my end you are the evil ones. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">And those reports are about verifying your deeds.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">If it exists.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">If they do. <br/><br/><br/><br/>Then you are the evil ones. <br/><br/></span></p><p class="cs40314EBF"><span class="cs1B16EEB5"><br/></span></p></body>
