		<p class="cs40314EBF"><span class="cs1B16EEB5">&quot;God is very sad because a specific part of your body has been badly damaged.&quot;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">If so, just like this, it is some kind of ambiguity someone is attempting to exploit,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">or,</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">blatant framing. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">I don&#39;t think there&#39;d be an misunderstanding. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Please look into it.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p></body>
