		<p class="cs40314EBF"><span class="cs1B16EEB5">sick with flu &nbsp;and super obese...</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">guessing weight at about 220...</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">need to turn this around...</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">could be 230... i weigh a lot obese...</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">should be 185-190...</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">this is no way to live.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">but. for another round i go.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">must finish up this court stuff.</span></p></body>
