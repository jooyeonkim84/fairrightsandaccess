		<p class="cs40314EBF"><span class="csDC4A80">My role is exactly this.</span></p><p class="cs40314EBF"><span class="csDC4A80">&nbsp;</span></p><p class="cs40314EBF"><span class="csDC4A80">I am a mirror.</span></p><p class="cs40314EBF"><span class="csDC4A80">&nbsp;</span></p><p class="cs40314EBF"><span class="csDC4A80">&nbsp;</span></p><p class="cs40314EBF"><span class="cs356C0354">You are seeing your own reflection.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Do you folks understand this?<br/><br/></span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">I am simply asking you to verify if what I observed is true.</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">And after assessment, it appears they have been. </span></p><p class="cs40314EBF"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs40314EBF"><span class="cs1B16EEB5">Simple as that.</span></p></body>
