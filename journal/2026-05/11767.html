		<p class="cs40314EBF"><span class="cs7A571DDB">이 작은 이모라는 분은, 겉으로는 좋은 사람인척 하고. 속으로는 그냥 흉심으로 가득찬 사람입니다. 뒷통수 치고, 자신이 내 인생에 법이 되어서, 내 인생 완전 파괴. 몰락. 시도 했다는것을, 법이 알았으면 좋겠습니다. &nbsp;나머지 사촌들도, 잘못을 한 만큼, 적당히 죄값을 받았으면 합니다.</span></p><p class="cs40314EBF"><span class="cs7A571DDB">한국 정부가 그것을 합의를 할것인지 아닐지는 모르겠지만, &nbsp;무죄다. 이것은 아닙니다. </span></p><p class="cs40314EBF"><span class="cs7A571DDB">이곳에서도 올라와 사람을 계속 끈임없이 겨냥 했으니. 이혜를 하셨으면 좋겠습니다. </span></p><p class="cs40314EBF"><span class="cs7A571DDB">&nbsp;</span></p></body>
