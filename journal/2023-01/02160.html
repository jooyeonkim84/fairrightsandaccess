		<p class="cs95E872D0"><span class="cs1B16EEB5">If there will be percentages to split on the mushroom idea Adam,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">decide later if it&#39;s done. (if they succeed in modification of its genome)</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">it should be higher than 5% as this is more direct of an idea.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">however, this doesn&#39;t mean i am dismissing my charges on you</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">for the things you&#39;ve done. </span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p></body>
