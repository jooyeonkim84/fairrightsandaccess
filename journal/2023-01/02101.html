		<p class="cs95E872D0"><span class="cs1B16EEB5">&quot;Moral condemnation used not for morality,</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">but as a weapon for manipulation is messed up.&quot;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">Very true Mr Musk, and very accurate. This is how my sister</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">and her husband tried destroying my life. Among other things.</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">&nbsp;</span></p><p class="cs95E872D0"><span class="cs1B16EEB5">People stop misleading. Tell me as-is.</span></p></body>
